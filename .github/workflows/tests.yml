name: Tests

# FAR's test suite (KspTests/): unit tests outside the game, and in-game tests in KSP 1.12.5 on GitHub's runners.
#
# Unit tests run for every push and pull request, against KSPBuildTools' stripped KSP assemblies (no secrets; the tests
# that need Unity's own code skip there). In-game tests need the game: KSP comes from encrypted 7z volumes in a private
# repo's release (KspTest/ci/Pack-KspGame.ps1), so they run only where the secrets are: pushes, manual runs and pull
# requests from branches of this repository. A pull request from a fork never gets the secrets, and nothing here runs
# a fork's code with them (no pull_request_target). The game folder is never cached or uploaded.
#
# Secrets: KSP_GAME_KEY (the archive key), KSP_GAME_TOKEN (fine-grained, Contents: read-only on the game repo alone).
# Variables: KSP_GAME_REPO (owner/name of the repo with the game releases).

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      filter:
        description: dotnet test --filter for the in-game tests (default all but the Explicit ones)
        required: false
        default: ""

permissions:
  contents: read

env:
  GAME_RELEASE: ksp-1.12.5
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KSP_ROOT: /tmp/ksp
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: git submodule update --init buildtools
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x
      - uses: KSPModdingLibs/KSPBuildTools/.github/actions/setup-ckan@1.1.1
        with:
          ckan-filters: ""
      - uses: KSPModdingLibs/KSPBuildTools/.github/actions/install-dependencies@1.1.1
        with:
          dependency-identifiers: ModularFlightIntegrator KSPCommunityFixes KSPBurst ModuleManager
      - name: Stamp commit SHA
        run: |
          cp .github/package.config.json config.json.user
          python -m buildtools replace
      - uses: KSPModdingLibs/KSPBuildTools/.github/actions/compile@1.1.1
        with:
          solution-file-path: FerramAerospaceResearch.sln
      - uses: actions/upload-artifact@v6
        with:
          name: far-gamedata
          path: GameData/FerramAerospaceResearch

  unit:
    # .NET Framework 4.8 tests: Windows
    needs: build
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x
      - uses: actions/download-artifact@v6
        with:
          name: far-gamedata
          path: ${{ runner.temp }}/far
      - name: Stripped KSP assemblies
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ksp.zip" https://github.com/KSPModdingLibs/KSPLibs/raw/main/KSP-1.12.5.zip
          7z x -y -bso0 -bsp0 "-o$RUNNER_TEMP/ksplibs" "$RUNNER_TEMP/ksp.zip"
      - name: Unit tests
        run: |
          w=$(cygpath -m "$RUNNER_TEMP")
          dotnet test KspTests/FerramAerospaceResearch.UnitTests "-p:KspDir=$w/ksplibs" "-p:FarBin=$w/far/Plugins" \
            --logger "console;verbosity=normal" --logger "trx;LogFileName=unit.trx" --results-directory "$w/trx"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unit-results
          path: ${{ runner.temp }}/trx

  ingame:
    needs: build
    # only where the secrets are: never for a fork's pull request
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          # the game's window, and so the shots: Windows' largest desktop mode; Linux batchmode's screen is 640x480
          # whatever is asked, so its shots are that drawn at twice the size
          - { name: windows, os: windows-2022, platform: windows, window: 1920x1080 }
          - { name: linux, os: ubuntu-24.04, platform: linux, window: 1280x960 }
    name: in-game (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      TEST_FILTER: ${{ inputs.filter }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x
      - name: Paths
        run: |
          w="$RUNNER_TEMP"
          command -v cygpath >/dev/null && w=$(cygpath -m "$w")
          echo "WORK=$w" >> "$GITHUB_ENV"
          echo "KSPTEST_GAME=$w/ksp" >> "$GITHUB_ENV"
          echo "KSPTEST_INSTANCES=$w/instances" >> "$GITHUB_ENV"
          echo "KSPTEST_RESULTS=$w/results" >> "$GITHUB_ENV"
          echo "KSPTEST_CKAN=$w/ckan/ckan.exe" >> "$GITHUB_ENV"
          echo "KSPTEST_KSP_ARGS=-batchmode" >> "$GITHUB_ENV"
          echo "KSPTEST_TEXTURES=low" >> "$GITHUB_ENV"
          echo "KSPTEST_WINDOW=${{ matrix.window }}" >> "$GITHUB_ENV"
          echo "FarGameData=$w/far/FerramAerospaceResearch" >> "$GITHUB_ENV"
      - name: Linux packages
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            xvfb xauth x11-utils libgl1 libgl1-mesa-dri libglu1-mesa libegl1 \
            libxcursor1 libxrandr2 libxi6 libxinerama1 libxss1 libxext6 libx11-6 libgtk-3-0 \
            libpulse0 libasound2t64 libudev1 mono-runtime mono-devel ca-certificates-mono p7zip-full
      - uses: actions/download-artifact@v6
        with:
          name: far-gamedata
          path: ${{ runner.temp }}/far/FerramAerospaceResearch
      - name: Download the game
        env:
          GH_TOKEN: ${{ secrets.KSP_GAME_TOKEN }}
          GAME_REPO: ${{ vars.KSP_GAME_REPO }}
        run: gh release download "$GAME_RELEASE-${{ matrix.platform }}" -R "$GAME_REPO" -p '*.7z.*' -D "$WORK/game-archive"
      - name: Extract the game
        env:
          KSP_GAME_KEY: ${{ secrets.KSP_GAME_KEY }}
        run: |
          7z x -y -bso0 -bsp0 "-p$KSP_GAME_KEY" "-o$KSPTEST_GAME" "$WORK/game-archive/$GAME_RELEASE-${{ matrix.platform }}.7z.001"
          rm -rf "$WORK/game-archive"
          if [ -f "$KSPTEST_GAME/KSP.x86_64" ]; then chmod +x "$KSPTEST_GAME/KSP.x86_64"; fi
      - name: CKAN
        run: |
          mkdir -p "$WORK/ckan"
          curl -fsSL -o "$KSPTEST_CKAN" https://github.com/KSP-CKAN/CKAN/releases/latest/download/ckan.exe
      # batchmode's screen on Windows is no bigger than the desktop (the runner's is 1024x768, with modes up to
      # 1920x1080); without the change FAR's windows run off its edges
      - name: Desktop size
        if: matrix.platform == 'windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type @'
          using System.Runtime.InteropServices;
          public static class Desktop
          {
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              public struct DEVMODE
              {
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
                  public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
                  public int dmFields, dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
                  public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
                  public short dmLogPixels;
                  public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
                  public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
              }
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern bool EnumDisplaySettings(string device, int mode, ref DEVMODE dm);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
          }
          '@
          function Mode([int]$i) { $dm = New-Object Desktop+DEVMODE; $dm.dmSize = [Runtime.InteropServices.Marshal]::SizeOf($dm); if ([Desktop]::EnumDisplaySettings([NullString]::Value, $i, [ref]$dm)) { $dm } }
          $cur = Mode -1
          "desktop $($cur.dmPelsWidth)x$($cur.dmPelsHeight)"
          $modes = for ($i = 0; ($m = Mode $i); $i++) { $m }
          "modes: " + (($modes | ForEach-Object { "$($_.dmPelsWidth)x$($_.dmPelsHeight)" } | Select-Object -Unique) -join ' ')
          # the smallest that holds the window
          $w, $h = $env:KSPTEST_WINDOW -split 'x' | ForEach-Object { [int]$_ }
          $fit = $modes | Where-Object { $_.dmPelsWidth -ge $w -and $_.dmPelsHeight -ge $h } |
            Sort-Object { $_.dmPelsWidth * $_.dmPelsHeight } | Select-Object -First 1
          if (-not $fit) { "no mode holds ${w}x${h}"; exit 0 }
          $cur.dmPelsWidth = $fit.dmPelsWidth; $cur.dmPelsHeight = $fit.dmPelsHeight; $cur.dmFields = 0x80000 -bor 0x100000
          "setting $($fit.dmPelsWidth)x$($fit.dmPelsHeight)"
          "ChangeDisplaySettings: $([Desktop]::ChangeDisplaySettings([ref]$cur, 0)) (0 is success)"
          $now = Mode -1
          "desktop now $($now.dmPelsWidth)x$($now.dmPelsHeight)"
      - name: Virtual display
        if: matrix.platform == 'linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >"$WORK/xvfb.log" 2>&1 &
          for i in $(seq 50); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.2; done
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: In-game tests
        run: |
          args=(test KspTests/FerramAerospaceResearch.KspTests.Run -p:KspDir="$KSPTEST_GAME"
                --logger "console;verbosity=normal" --logger "trx;LogFileName=ingame.trx" --results-directory "$WORK/trx")
          [ -n "$TEST_FILTER" ] && args+=(--filter "$TEST_FILTER")
          dotnet "${args[@]}"
      # a crashed KSP leaves its native stack in Unity's Player.log and the crash folder, outside the results
      - name: Crash reports
        if: failure()
        run: |
          d="$KSPTEST_RESULTS/unity"; mkdir -p "$d"
          if [ "${{ matrix.platform }}" = windows ]; then
            p="$(cygpath -u "$USERPROFILE")/AppData/LocalLow/Squad/Kerbal Space Program"
            c="$(cygpath -u "$LOCALAPPDATA")/Temp/Squad/Kerbal Space Program/Crashes"
          else
            p="$HOME/.config/unity3d/Squad/Kerbal Space Program"; c=""
          fi
          cp "$p"/Player*.log "$d/" 2>/dev/null || echo "no Player.log in $p"
          if [ -n "$c" ] && [ -d "$c" ]; then cp -r "$c" "$d/"; fi
          ls -laR "$d"
      # results, logs and the test report only: never the game or an instance
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ingame-results-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/results
            ${{ runner.temp }}/trx
          if-no-files-found: warn

  # FAR's line coverage: the unit and in-game tests against FAR instrumented by AltCover, one count per sequence point,
  # merged into a report (the job summary and the coverage artifact). Runs wherever the in-game job does (FastVisit
  # makes the instrumented run fast enough for every push). Same secrets rule as the in-game job; the game folder and its
  # instances are never uploaded, only the counts.
  coverage:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      TEST_FILTER: ${{ inputs.filter }}
      ALTCOVER: "9.0.145"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Paths
        run: |
          w=$(cygpath -m "$RUNNER_TEMP")
          echo "WORK=$w" >> "$GITHUB_ENV"
          echo "COV=$w/cov" >> "$GITHUB_ENV"
          echo "KSPTEST_GAME=$w/ksp" >> "$GITHUB_ENV"
          echo "KSPTEST_INSTANCES=$w/instances" >> "$GITHUB_ENV"
          echo "KSPTEST_RESULTS=$w/results" >> "$GITHUB_ENV"
          echo "KSPTEST_CKAN=$w/ckan/ckan.exe" >> "$GITHUB_ENV"
          echo "KSPTEST_KSP_ARGS=-batchmode" >> "$GITHUB_ENV"
          echo "KSPTEST_TEXTURES=low" >> "$GITHUB_ENV"
          # the runner's desktop as it comes (no screenshots kept here)
          echo "KSPTEST_WINDOW=1024x768" >> "$GITHUB_ENV"
          echo "FarGameData=$w/cov/overlay/FerramAerospaceResearch" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v6
        with:
          name: far-gamedata
          path: ${{ runner.temp }}/far/FerramAerospaceResearch
      - name: Download the game
        env:
          GH_TOKEN: ${{ secrets.KSP_GAME_TOKEN }}
          GAME_REPO: ${{ vars.KSP_GAME_REPO }}
        run: gh release download "$GAME_RELEASE-windows" -R "$GAME_REPO" -p '*.7z.*' -D "$WORK/game-archive"
      - name: Extract the game
        env:
          KSP_GAME_KEY: ${{ secrets.KSP_GAME_KEY }}
        run: |
          7z x -y -bso0 -bsp0 "-p$KSP_GAME_KEY" "-o$KSPTEST_GAME" "$WORK/game-archive/$GAME_RELEASE-windows.7z.001"
          rm -rf "$WORK/game-archive"
      - name: CKAN
        run: |
          mkdir -p "$WORK/ckan"
          curl -fsSL -o "$KSPTEST_CKAN" https://github.com/KSP-CKAN/CKAN/releases/latest/download/ckan.exe
      - name: Instrument FAR
        run: |
          curl -fsSL -o "$WORK/altcover.nupkg" "https://www.nuget.org/api/v2/package/altcover/$ALTCOVER"
          7z x -y -bso0 -bsp0 "-o$WORK/altcover" "$WORK/altcover.nupkg" 'tools/net472/*'
          p="$WORK/far/FerramAerospaceResearch/Plugins"
          mkdir -p "$COV/in" "$COV/farbin" "$COV/overlay"
          cp "$p"/FerramAerospaceResearch*.dll "$p"/FerramAerospaceResearch*.pdb "$COV/in/"
          # --linecover: sequence points only (the report counts lines); the branch probes cost about a fifth of the run
          # KSP's own assemblies resolve FAR's references (it needs nothing from the mods it talks to)
          deps=(); for f in "$(cygpath -u "$KSPTEST_GAME")"/KSP_x64_Data/Managed/*.dll; do deps+=("-d=$(cygpath -m "$f")"); done
          "$WORK/altcover/tools/net472/AltCover.exe" -i="$COV/in" -o="$COV/out" --save --portable --linecover -a=ExcludeFromCodeCoverage "${deps[@]}" > "$COV/instrument.log" 2>&1 ||
            { tail -20 "$COV/instrument.log"; exit 1; }
          # AltCover's recorder allocates and looks up string-keyed dictionaries on every visit, recorded points too:
          # under Mono's stop-the-world GC FAR's multithreaded sweeps ran ~20x slower for it. Every visit call goes to
          # FastVisit instead, which passes only a point's first visit on (all AltCover records) and returns at once after
          dotnet build KspTests/Coverage/FarCoverage.FastVisit -c Release -v q -nologo -o "$COV/fastvisit"
          dotnet run -c Release --project KspTests/Coverage/CovPatch -- "$COV/out/FerramAerospaceResearch.dll" "$COV/out/FerramAerospaceResearch.Base.dll"
          cp "$COV/fastvisit/FarCoverage.FastVisit.dll" "$COV/out/"
          # the in-game tests' FAR: the build's GameData with the instrumented assemblies, the recorder and its report
          cp -r "$WORK/far/FerramAerospaceResearch" "$COV/overlay/"; rm -f "$COV/overlay/FerramAerospaceResearch/Plugins/"*.pdb
          cp "$COV/out"/FerramAerospaceResearch*.dll "$COV/out/AltCover.Recorder.g.dll" "$COV/out/FarCoverage.FastVisit.dll" "$COV/out/coverage.xml" \
            "$COV/overlay/FerramAerospaceResearch/Plugins/"
          # the unit tests' FAR
          cp "$COV/out"/FerramAerospaceResearch*.dll "$COV/out/AltCover.Recorder.g.dll" "$COV/out/FarCoverage.FastVisit.dll" "$p/ferramGraph.dll" "$COV/farbin/"
      # against the stripped assemblies as the unit job runs them (they carry Unity.Burst, which the stock game does not)
      - name: Unit tests
        run: |
          curl -fsSL -o "$WORK/ksplibs.zip" https://github.com/KSPModdingLibs/KSPLibs/raw/main/KSP-1.12.5.zip
          7z x -y -bso0 -bsp0 "-o$WORK/ksplibs" "$WORK/ksplibs.zip"
          U=KspTests/FerramAerospaceResearch.UnitTests/bin/Debug/net48
          dotnet build KspTests/FerramAerospaceResearch.UnitTests "-p:KspDir=$WORK/ksplibs" "-p:FarBin=$COV/farbin" -v q -nologo
          # the build copies only the FAR assemblies it references: the recorder, FastVisit and the report by hand
          cp "$COV/out/coverage.xml" "$COV/out/AltCover.Recorder.g.dll" "$COV/out/FarCoverage.FastVisit.dll" "$U/"
          dotnet test KspTests/FerramAerospaceResearch.UnitTests --no-build || echo "::warning::unit tests failed under coverage"
          cp "$U/coverage.xml" "$COV/unit.xml"
      - name: In-game tests
        env:
          # each KSP session's counts, copied into its results once KSP exits (the next session's deploy into the
          # same instance writes over them)
          KSPTEST_COLLECT: GameData/FerramAerospaceResearch/Plugins/coverage.xml
        run: |
          args=(test KspTests/FerramAerospaceResearch.KspTests.Run -p:KspDir="$KSPTEST_GAME" --logger "console;verbosity=normal")
          [ -n "$TEST_FILTER" ] && args+=(--filter "$TEST_FILTER")
          # timing-sensitive tests can fail under the instrumentation's slowdown; their counts still go in
          dotnet "${args[@]}" || echo "::warning::in-game tests failed under coverage"
      - name: Report
        run: |
          reports=("$COV/unit.xml"); i=0
          for f in "$(cygpath -u "$KSPTEST_RESULTS")"/*/collected/GameData/FerramAerospaceResearch/Plugins/coverage.xml; do
            [ -f "$f" ] || continue
            i=$((i+1)); cp "$f" "$COV/ingame-$i.xml"; reports+=("$COV/ingame-$i.xml")
          done
          echo "$i KSP session report(s)"
          python -I .github/scripts/coverage_report.py "${GITHUB_REPOSITORY#*/}/" "$COV/report.md" "${reports[@]}"
          cat "$COV/report.md" >> "$GITHUB_STEP_SUMMARY"
      # the report and the counts only: never the game or an instance
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage
          path: |
            ${{ runner.temp }}/cov/report.md
            ${{ runner.temp }}/cov/unit.xml
            ${{ runner.temp }}/cov/ingame-*.xml
          if-no-files-found: warn

  # one HTML page of screenshots per in-game leg, uploaded unzipped so it opens as a single file. Its own job, from
  # the uploaded results only: a pip install never runs beside the extracted game.
  gallery:
    needs: ingame
    if: always() && needs.ingame.result != 'skipped'
    strategy:
      fail-fast: false
      matrix:
        name: [windows, linux]
    name: gallery (${{ matrix.name }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: ingame-results-${{ matrix.name }}
          path: ${{ runner.temp }}/results-${{ matrix.name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the page
        run: |
          python -m pip install --quiet --disable-pip-version-check pillow || echo "no Pillow: the page embeds the PNGs"
          python .github/scripts/shots_gallery.py "$RUNNER_TEMP/results-${{ matrix.name }}/results" \
            "$RUNNER_TEMP/gallery/screenshots-${{ matrix.name }}.html" \
            --title "FAR in-game tests: ${{ matrix.name }}, ${GITHUB_SHA::8}"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/gallery/screenshots-${{ matrix.name }}.html
          archive: false
